name: YouTube Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
        type: string
  repository_dispatch:
    types: [yt-download]

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Extract video URL
        id: url
        run: |
          URL="${{ github.event.inputs.video_url || github.event.client_payload.video_url }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          ID=$(echo "$URL" | grep -oE '(v=|youtu\.be/|shorts/|embed/)[a-zA-Z0-9_-]{11}' | head -1 | grep -oE '[a-zA-Z0-9_-]{11}')
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "Video ID: $ID"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install yt-dlp + ffmpeg + POT plugin
        run: |
          pip install --quiet --upgrade yt-dlp
          pip install --quiet bgutil-ytdlp-pot-provider
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build POT provider server
        run: |
          git clone --depth=1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm install --silent --no-audit --no-fund
          npx --yes tsc
          echo "=== Build done ==="
          ls -la build/ 2>/dev/null | head -5

      - name: Start POT provider server
        run: |
          cd /tmp/bgutil/server
          nohup node build/main.js > /tmp/pot.log 2>&1 &
          echo "POT server PID: $!"
          sleep 5
          echo "=== POT log ==="
          cat /tmp/pot.log
          echo "=== Ping test ==="
          curl -s -m 10 http://127.0.0.1:4416/ping || echo "ping failed"

      - name: Decode cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
            echo "Cookies: $(wc -l < cookies.txt) lines"
          fi

      - name: Download audio (with POT)
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          URL="${{ steps.url.outputs.url }}"
          ID="${{ steps.url.outputs.id }}"
          OUT="%(title).150B_${ID}.%(ext)s"
          COOKIE_OPT=""
          [ -f cookies.txt ] && COOKIE_OPT="--cookies cookies.txt"

          POT_ARG="--extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"

          # === Strategy 1: mweb + POT + cookies ===
          echo "=== Strategy 1: mweb + POT ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --js-runtimes deno \
            $POT_ARG \
            --extractor-args "youtube:player_client=mweb,web" \
            -f "bestaudio/best" \
            -x --audio-format mp3 --audio-quality 192K \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # === Strategy 2: web_safari + POT ===
          echo "=== Strategy 2: web_safari + POT ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --js-runtimes deno \
            $POT_ARG \
            --extractor-args "youtube:player_client=web_safari,tv_embedded" \
            -f "bestaudio[ext=m4a]/bestaudio" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # === Strategy 3: tv + POT ===
          echo "=== Strategy 3: tv + POT ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --js-runtimes deno \
            $POT_ARG \
            --extractor-args "youtube:player_client=tv,tv_embedded" \
            -f "bestaudio/best" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL"

      - name: Convert to MP3
        run: |
          for f in *.m4a *.webm *.opus *.ogg; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            ffmpeg -i "$f" -vn -acodec libmp3lame -ab 192k -y "$base.mp3"
            rm -f "$f"
          done
          ls -la

      - name: Check result
        run: |
          ls -la *.mp3 2>/dev/null || ls -la
          if ! ls *.mp3 1>/dev/null 2>&1; then
            echo "::error::Không tải được MP3"
            exit 1
          fi

      - name: Read title
        id: title
        run: |
          TITLE=$(cat info.txt 2>/dev/null | head -1 | tr -d '\n')
          [ -z "$TITLE" ] && TITLE="YouTube ${{ steps.url.outputs.id }}"
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ steps.url.outputs.id }}-${{ github.run_id }}
          name: "${{ steps.title.outputs.title }}"
          files: "*.mp3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
