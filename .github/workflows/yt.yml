name: YouTube Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
        type: string
  repository_dispatch:
    types: [yt-download]

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Extract video URL
        id: url
        run: |
          URL="${{ github.event.inputs.video_url || github.event.client_payload.video_url }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          ID=$(echo "$URL" | grep -oE '(v=|youtu\.be/|shorts/|embed/)[a-zA-Z0-9_-]{11}' | head -1 | grep -oE '[a-zA-Z0-9_-]{11}')
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "Video ID: $ID"

      - name: Setup Python + Deno
        run: |
          python3 --version
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export PATH="$HOME/.deno/bin:$PATH"
          deno --version

      - name: Install yt-dlp + ffmpeg + POT
        run: |
          pip install --quiet --upgrade yt-dlp
          pip install --quiet bgutil-ytdlp-pot-provider
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          echo "yt-dlp: $(yt-dlp --version)"

      - name: Build POT server
        run: |
          git clone --depth=1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm install --silent --no-audit --no-fund
          npx --yes tsc
          echo "=== Build done ==="
          ls -la build/ | head -5

      - name: Start POT server
        run: |
          cd /tmp/bgutil/server
          nohup node build/main.js > /tmp/pot.log 2>&1 &
          echo "PID: $!"
          sleep 8
          echo "=== POT log ==="
          cat /tmp/pot.log
          echo "=== Ping ==="
          curl -s -m 10 "http://127.0.0.1:4416/ping" && echo "" || echo "ping failed"

      - name: Decode cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
            echo "Cookies: $(wc -l < cookies.txt) lines"
            head -3 cookies.txt
          else
            echo "No cookies secret"
          fi

      - name: Test cookies
        id: cktest
        continue-on-error: true
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          if [ ! -f cookies.txt ]; then
            echo "skip=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "=== Dry run (không tải) ==="
          yt-dlp --cookies cookies.txt --no-warnings \
            --simulate --print "%(title)s" \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1 | tail -10
          echo "cookie_ok=1" >> $GITHUB_OUTPUT

      - name: List formats (debug)
        continue-on-error: true
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          COOKIE_OPT=""
          [ -f cookies.txt ] && COOKIE_OPT="--cookies cookies.txt"
          URL="${{ steps.url.outputs.url }}"

          echo "=== List formats (mweb+POT) ==="
          yt-dlp --no-warnings --list-formats $COOKIE_OPT \
            --js-runtimes deno \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416;youtube:player_client=mweb" \
            "$URL" 2>&1 | head -60

          echo ""
          echo "=== List formats (web_safari no POT) ==="
          yt-dlp --no-warnings --list-formats $COOKIE_OPT \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=web_safari" \
            "$URL" 2>&1 | head -60

      - name: Download audio (multi-strategy)
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          URL="${{ steps.url.outputs.url }}"
          ID="${{ steps.url.outputs.id }}"
          OUT="%(title).150B_${ID}.%(ext)s"
          COOKIE_OPT=""
          [ -f cookies.txt ] && COOKIE_OPT="--cookies cookies.txt"
          POT="youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"

          # S1: mweb + POT + bestaudio (gộp extractor-args!)
          echo ""
          echo "═══════ S1: mweb + POT + bestaudio ═══════"
          yt-dlp --no-playlist --no-warnings $COOKIE_OPT --js-runtimes deno \
            --extractor-args "$POT;youtube:player_client=mweb" \
            -f "bestaudio/best" -x --audio-format mp3 --audio-quality 192K \
            --output "$OUT" --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # S2: web_safari + POT
          echo ""
          echo "═══════ S2: web_safari + POT ═══════"
          yt-dlp --no-playlist --no-warnings $COOKIE_OPT --js-runtimes deno \
            --extractor-args "$POT;youtube:player_client=web_safari" \
            -f "bestaudio/best" -x --audio-format mp3 --audio-quality 192K \
            --output "$OUT" --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # S3: tv_embedded (không cần POT)
          echo ""
          echo "═══════ S3: tv_embedded ═══════"
          yt-dlp --no-playlist --no-warnings $COOKIE_OPT --js-runtimes deno \
            --extractor-args "youtube:player_client=tv_embedded" \
            -f "bestaudio/best" -x --audio-format mp3 --audio-quality 192K \
            --output "$OUT" --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # S4: android_vr
          echo ""
          echo "═══════ S4: android_vr ═══════"
          yt-dlp --no-playlist --no-warnings $COOKIE_OPT --js-runtimes deno \
            --extractor-args "youtube:player_client=android_vr" \
            -f "bestaudio/best" -x --audio-format mp3 --audio-quality 192K \
            --output "$OUT" --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # S5: format 18 (muxed MP4, luôn có)
          echo ""
          echo "═══════ S5: itag 18 muxed ═══════"
          yt-dlp --no-playlist --no-warnings $COOKIE_OPT --js-runtimes deno \
            --extractor-args "$POT;youtube:player_client=mweb" \
            -f "18/b" \
            --output "$OUT" --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # S6: ios + POT
          echo ""
          echo "═══════ S6: ios + POT ═══════"
          yt-dlp --no-playlist --no-warnings $COOKIE_OPT --js-runtimes deno \
            --extractor-args "$POT;youtube:player_client=ios" \
            -f "bestaudio/best" -x --audio-format mp3 --audio-quality 192K \
            --output "$OUT" --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # S7: default no cookies
          echo ""
          echo "═══════ S7: default no cookies ═══════"
          yt-dlp --no-playlist --no-warnings --js-runtimes deno \
            --extractor-args "youtube:player_client=default" \
            -f "bestaudio/best" -x --audio-format mp3 --audio-quality 192K \
            --output "$OUT" --print-to-file "%(title)s" info.txt \
            "$URL"

      - name: Convert to MP3
        if: always()
        run: |
          for f in *.m4a *.webm *.opus *.ogg *.mp4; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            echo "Convert: $f → $base.mp3"
            ffmpeg -i "$f" -vn -acodec libmp3lame -ab 192k -y "$base.mp3" 2>&1 | tail -2
            [ "$f" != "$base.mp3" ] && rm -f "$f"
          done
          echo "=== MP3 files ==="
          ls -la *.mp3 2>/dev/null || echo "NO MP3"

      - name: Check result
        run: |
          if ! ls *.mp3 1>/dev/null 2>&1; then
            echo "::error::Không tải được MP3 — xem log các strategy ở trên"
            exit 1
          fi

      - name: Read title
        id: title
        run: |
          TITLE=$(cat info.txt 2>/dev/null | head -1 | tr -d '\n')
          [ -z "$TITLE" ] && TITLE="YouTube ${{ steps.url.outputs.id }}"
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ steps.url.outputs.id }}-${{ github.run_id }}
          name: "${{ steps.title.outputs.title }}"
          files: "*.mp3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
