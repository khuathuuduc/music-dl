name: YouTube Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
        type: string
  repository_dispatch:
    types: [yt-download]

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Extract video URL
        id: url
        run: |
          URL="${{ github.event.inputs.video_url || github.event.client_payload.video_url }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          ID=$(echo "$URL" | grep -oE '(v=|youtu\.be/|shorts/|embed/)[a-zA-Z0-9_-]{11}' | head -1 | grep -oE '[a-zA-Z0-9_-]{11}')
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "Video ID: $ID"

      - name: Setup Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install yt-dlp + ffmpeg + POT plugin
        run: |
          pip install --quiet --upgrade yt-dlp
          pip install --quiet bgutil-ytdlp-pot-provider
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          echo "yt-dlp version: $(yt-dlp --version)"

      - name: Build POT server
        run: |
          git clone --depth=1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm install --silent --no-audit --no-fund
          npx --yes tsc
          echo "Build done"

      - name: Start POT server
        run: |
          cd /tmp/bgutil/server
          nohup node build/main.js > /tmp/pot.log 2>&1 &
          sleep 8
          echo "=== POT log ==="
          cat /tmp/pot.log
          echo "=== Ping ==="
          curl -s -m 10 "http://127.0.0.1:4416/ping" && echo "" || echo "PING FAILED"

      - name: Decode cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
            LINES=$(wc -l < cookies.txt)
            echo "✅ Cookies decoded: $LINES lines"
            echo "First line: $(head -1 cookies.txt)"
            echo "Sample cookie: $(head -5 cookies.txt | tail -1)"
          else
            echo "❌ ERROR: YT_COOKIES secret is empty!"
            exit 1
          fi

      - name: Verify cookies file
        run: |
          if [ -f cookies.txt ]; then
            echo "✅ cookies.txt exists: $(ls -la cookies.txt)"
          else
            echo "❌ cookies.txt NOT FOUND"
            exit 1
          fi

      - name: Test yt-dlp with cookies + POT (dry run)
        continue-on-error: true
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          yt-dlp \
            --cookies cookies.txt \
            --js-runtimes deno \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            --extractor-args "youtube:player_client=ios" \
            --no-warnings --simulate --print "%(title)s|%(format_id)s" \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1 | head -20

      - name: Download (6 strategies)
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          URL="${{ steps.url.outputs.url }}"
          ID="${{ steps.url.outputs.id }}"
          OUT="%(title).150B_${ID}.%(ext)s"

          # Flags tách riêng — ĐÚNG SYNTAX
          COOKIE_ARG="--cookies cookies.txt"
          JS_ARG="--js-runtimes deno"
          POT_ARG="--extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"

          # Helper: check tải được
          check_dl() {
            ls *.mp3 *.m4a *.webm *.opus *.ogg *.mp4 2>/dev/null | grep -v '^$' | head -1
          }

          echo ""
          echo "═══════════ S1: ios + POT + cookies ═══════════"
          yt-dlp --no-playlist --no-warnings --no-check-formats \
            $COOKIE_ARG $JS_ARG $POT_ARG \
            --extractor-args "youtube:player_client=ios" \
            -f "ba/b" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" 2>&1 | tee /tmp/s1.log
          [ -n "$(check_dl)" ] && { echo "✅ S1 SUCCESS"; exit 0; }

          echo ""
          echo "═══════════ S2: tv + POT + cookies ═══════════"
          yt-dlp --no-playlist --no-warnings --no-check-formats \
            $COOKIE_ARG $JS_ARG $POT_ARG \
            --extractor-args "youtube:player_client=tv" \
            -f "ba/b" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" 2>&1 | tee /tmp/s2.log
          [ -n "$(check_dl)" ] && { echo "✅ S2 SUCCESS"; exit 0; }

          echo ""
          echo "═══════════ S3: mweb + POT + cookies ═══════════"
          yt-dlp --no-playlist --no-warnings --no-check-formats \
            $COOKIE_ARG $JS_ARG $POT_ARG \
            --extractor-args "youtube:player_client=mweb" \
            -f "ba/b" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" 2>&1 | tee /tmp/s3.log
          [ -n "$(check_dl)" ] && { echo "✅ S3 SUCCESS"; exit 0; }

          echo ""
          echo "═══════════ S4: web_safari + POT + cookies ═══════════"
          yt-dlp --no-playlist --no-warnings --no-check-formats \
            $COOKIE_ARG $JS_ARG $POT_ARG \
            --extractor-args "youtube:player_client=web_safari" \
            -f "ba/b" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" 2>&1 | tee /tmp/s4.log
          [ -n "$(check_dl)" ] && { echo "✅ S4 SUCCESS"; exit 0; }

          echo ""
          echo "═══════════ S5: android (không POT) + cookies ═══════════"
          yt-dlp --no-playlist --no-warnings --no-check-formats \
            $COOKIE_ARG $JS_ARG \
            --extractor-args "youtube:player_client=android" \
            -f "ba/b" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" 2>&1 | tee /tmp/s5.log
          [ -n "$(check_dl)" ] && { echo "✅ S5 SUCCESS"; exit 0; }

          echo ""
          echo "═══════════ S6: itag 18 muxed ═══════════"
          yt-dlp --no-playlist --no-warnings --no-check-formats \
            $COOKIE_ARG $JS_ARG $POT_ARG \
            --extractor-args "youtube:player_client=mweb,tv" \
            -f "18" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" 2>&1 | tee /tmp/s6.log
          [ -n "$(check_dl)" ] && { echo "✅ S6 SUCCESS"; exit 0; }

          echo ""
          echo "═══════════ TẤT CẢ THẤT BẠI — Debug info ═══════════"
          echo "=== List formats iOS ==="
          yt-dlp --cookies cookies.txt --js-runtimes deno $POT_ARG \
            --extractor-args "youtube:player_client=ios" \
            --list-formats "$URL" 2>&1 | head -50
          exit 1

      - name: Convert to MP3
        if: always()
        run: |
          for f in *.m4a *.webm *.opus *.ogg *.mp4; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            echo "Convert: $f → $base.mp3"
            ffmpeg -i "$f" -vn -acodec libmp3lame -ab 192k -y "$base.mp3" 2>&1 | tail -1
            [ "$f" != "$base.mp3" ] && rm -f "$f"
          done
          echo "=== Files ==="
          ls -la

      - name: Check result
        run: |
          if ! ls *.mp3 1>/dev/null 2>&1; then
            echo "::error::Không tải được MP3"
            exit 1
          fi
          echo "✅ MP3 ready"

      - name: Read title
        id: title
        run: |
          TITLE=$(cat info.txt 2>/dev/null | head -1 | tr -d '\n')
          [ -z "$TITLE" ] && TITLE="YouTube ${{ steps.url.outputs.id }}"
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ steps.url.outputs.id }}-${{ github.run_id }}
          name: "${{ steps.title.outputs.title }}"
          files: "*.mp3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
