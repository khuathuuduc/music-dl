name: YouTube Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
        type: string
  repository_dispatch:
    types: [yt-download]

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Extract video URL
        id: url
        run: |
          URL="${{ github.event.inputs.video_url || github.event.client_payload.video_url }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          ID=$(echo "$URL" | grep -oE '(v=|youtu\.be/|shorts/)[a-zA-Z0-9_-]{11}' | head -1 | grep -oE '[a-zA-Z0-9_-]{11}')
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "Video ID: $ID"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and ffmpeg
        run: |
          pip install --quiet --upgrade yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Decode cookies
        id: cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
            echo "✅ Cookies file: $(wc -l < cookies.txt) lines"
            echo "has_cookies=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No YT_COOKIES secret — trying without cookies"
            echo "has_cookies=false" >> $GITHUB_OUTPUT
          fi

      - name: Download MP3
        run: |
          URL="${{ steps.url.outputs.url }}"
          ID="${{ steps.url.outputs.id }}"
          OUT="%(title).150B_${ID}.%(ext)s"

          COOKIE_OPT=""
          [ -f cookies.txt ] && COOKIE_OPT="--cookies cookies.txt"

          echo "=== Strategy 1: web_safari + cookies ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --extractor-args "youtube:player_client=web_safari,web,tv_embedded" \
            --extract-audio --audio-format mp3 --audio-quality 192K \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          echo "=== Strategy 2: android + cookies ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --extractor-args "youtube:player_client=android,ios" \
            --extract-audio --audio-format mp3 --audio-quality 192K \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          echo "=== Strategy 3: default ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --extract-audio --audio-format mp3 --audio-quality 192K \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL"

      - name: Check result
        run: |
          ls -la *.mp3 2>/dev/null
          if ! ls *.mp3 1>/dev/null 2>&1; then
            echo "::error::Không tải được MP3"
            exit 1
          fi

      - name: Read title
        id: title
        run: |
          TITLE=$(cat info.txt 2>/dev/null | head -1 | tr -d '\n')
          [ -z "$TITLE" ] && TITLE="YouTube ${{ steps.url.outputs.id }}"
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ steps.url.outputs.id }}-${{ github.run_id }}
          name: "${{ steps.title.outputs.title }}"
          body: |
            Video ID: ${{ steps.url.outputs.id }}
            Title: ${{ steps.title.outputs.title }}
          files: "*.mp3"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
