name: YouTube Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
        type: string
  repository_dispatch:
    types: [yt-download]

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Extract video URL
        id: url
        run: |
          URL="${{ github.event.inputs.video_url || github.event.client_payload.video_url }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          ID=$(echo "$URL" | grep -oE '(v=|youtu\.be/|shorts/|embed/)[a-zA-Z0-9_-]{11}' | head -1 | grep -oE '[a-zA-Z0-9_-]{11}')
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "Video ID: $ID"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Deno (JS runtime cho yt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export PATH="$HOME/.deno/bin:$PATH"
          deno --version

      - name: Install yt-dlp + ffmpeg
        run: |
          pip install --quiet --upgrade yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Decode cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
            echo "Cookies: $(wc -l < cookies.txt) lines"
          fi

      - name: Verify yt-dlp with Deno
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          yt-dlp --version
          yt-dlp --js-runtimes deno --list-extractors 2>&1 | head -5 || true

      - name: Download audio
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          URL="${{ steps.url.outputs.url }}"
          ID="${{ steps.url.outputs.id }}"
          OUT="%(title).150B_${ID}.%(ext)s"
          COOKIE_OPT=""
          [ -f cookies.txt ] && COOKIE_OPT="--cookies cookies.txt"

          # === Strategy 1: default client + Deno + cookies ===
          echo "=== Strategy 1: default + deno + cookies ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=default,-tv,web_safari" \
            -f "bestaudio/best" \
            -x --audio-format mp3 --audio-quality 192K \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # === Strategy 2: web + deno ===
          echo "=== Strategy 2: web + deno ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=web,mweb" \
            -f "bestaudio[ext=m4a]/bestaudio" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # === Strategy 3: tv_embedded + deno ===
          echo "=== Strategy 3: tv_embedded + deno ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=tv_embedded,web_embedded,tv" \
            -f "bestaudio[ext=m4a]/bestaudio/best" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL" && exit 0

          # === Strategy 4: android_vr (không cần cipher) ===
          echo "=== Strategy 4: android_vr ==="
          yt-dlp \
            --no-playlist --no-warnings \
            $COOKIE_OPT \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=android_vr,android_testsuite" \
            -f "bestaudio/best" \
            --output "$OUT" \
            --print-to-file "%(title)s" info.txt \
            "$URL"

      - name: Convert to MP3 if needed
        run: |
          for f in *.m4a *.webm *.opus *.ogg; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            echo "Converting $f → $base.mp3"
            ffmpeg -i "$f" -vn -acodec libmp3lame -ab 192k -y "$base.mp3"
            rm -f "$f"
          done
          ls -la

      - name: Check result
        run: |
          ls -la *.mp3 2>/dev/null
          if ! ls *.mp3 1>/dev/null 2>&1; then
            echo "::error::Không tải được MP3"
            exit 1
          fi

      - name: Read title
        id: title
        run: |
          TITLE=$(cat info.txt 2>/dev/null | head -1 | tr -d '\n')
          [ -z "$TITLE" ] && TITLE="YouTube ${{ steps.url.outputs.id }}"
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ steps.url.outputs.id }}-${{ github.run_id }}
          name: "${{ steps.title.outputs.title }}"
          body: |
            Video ID: ${{ steps.url.outputs.id }}
            Title: ${{ steps.title.outputs.title }}
          files: "*.mp3"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
